[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rover-mission"
version = "0.1.0"
description = "SENTINEL HIVE Pi rover mission runtime"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
camera = ["opencv-python>=4.8"]
serial = ["pyserial>=3.5"]
mqtt = ["paho-mqtt>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
