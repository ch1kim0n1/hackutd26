[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defense-gateway"
version = "0.1.0"
description = "SENTINEL HIVE virtual defense gateway — simulated flow-decision contract (issue #105)"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
