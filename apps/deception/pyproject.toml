[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deception"
version = "0.1.0"
description = "Deception routing + evidence integration (#108)"
requires-python = ">=3.10"
dependencies = ["defense-gateway"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
