<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="How the hardware is intended to work">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08121d"/><stop offset="1" stop-color="#101d29"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64d4df"/></marker></defs>
<rect width="1600" height="900" fill="url(#bg)"/><path d="M0 145 H1600" stroke="#294858"/>
<g font-family="Inter, Arial, sans-serif"><text x="64" y="52" fill="#63dce8" font-size="16" font-weight="700">BLINDSPOT  /  VISUAL FIELD GUIDE</text><text x="64" y="95" fill="#f3f9fc" font-size="37" font-weight="700">How the hardware is intended to work</text><text x="64" y="124" fill="#a9c0cc" font-size="19" font-weight="400">Proposed rover, sensor, power and safety architecture</text><text x="64" y="193" fill="#65dce8" font-size="16" font-weight="700">SENSING + EVIDENCE</text><text x="64" y="393" fill="#65dce8" font-size="16" font-weight="700">MOTION + LOCAL SAFETY</text><text x="64" y="593" fill="#65dce8" font-size="16" font-weight="700">POWER + INDEPENDENT STOP</text><rect x="64" y="210" width="448" height="145" rx="15" fill="#122331" stroke="#294858" stroke-width="2"/><rect x="64" y="210" width="6" height="145" rx="3" fill="#50d9e6"/><text x="88" y="240" fill="#50d9e6" font-size="15" font-weight="700">LAB DEVICES</text><text x="88" y="275" fill="#f2f8fb" font-size="25" font-weight="700">Pucks + rover</text><text x="88" y="306" fill="#b8cdd8" font-size="18" font-weight="400">Wi-Fi, cabinet and BLE inputs</text><text x="88" y="332" fill="#b8cdd8" font-size="18" font-weight="400">Camera connects to rover Pi</text><rect x="576" y="210" width="448" height="145" rx="15" fill="#122331" stroke="#294858" stroke-width="2"/><rect x="576" y="210" width="6" height="145" rx="3" fill="#50d9e6"/><text x="600" y="240" fill="#50d9e6" font-size="15" font-weight="700">LOCAL COLLECTION</text><text x="600" y="275" fill="#f2f8fb" font-size="25" font-weight="700">Pi + sensor pucks</text><text x="600" y="306" fill="#b8cdd8" font-size="18" font-weight="400">Pucks publish observations</text><text x="600" y="332" fill="#b8cdd8" font-size="18" font-weight="400">Pi collects rover evidence</text><rect x="1088" y="210" width="448" height="145" rx="15" fill="#122331" stroke="#294858" stroke-width="2"/><rect x="1088" y="210" width="6" height="145" rx="3" fill="#50d9e6"/><text x="1112" y="240" fill="#50d9e6" font-size="15" font-weight="700">UPLINK</text><text x="1112" y="275" fill="#f2f8fb" font-size="25" font-weight="700">Gateway + command</text><text x="1112" y="306" fill="#b8cdd8" font-size="18" font-weight="400">Relay observations and status</text><text x="1112" y="332" fill="#b8cdd8" font-size="18" font-weight="400">Gateway validates device events</text><path d="M512 282 H570" fill="none" stroke="#64d4df" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1024 282 H1082" fill="none" stroke="#64d4df" stroke-width="3"  marker-end="url(#arrow)"/><rect x="64" y="410" width="448" height="145" rx="15" fill="#122331" stroke="#294858" stroke-width="2"/><rect x="64" y="410" width="6" height="145" rx="3" fill="#50d9e6"/><text x="88" y="440" fill="#50d9e6" font-size="15" font-weight="700">MISSION INPUT</text><text x="88" y="475" fill="#f2f8fb" font-size="25" font-weight="700">Bounded intent</text><text x="88" y="506" fill="#b8cdd8" font-size="18" font-weight="400">Surveyed waypoints and speed cap</text><text x="88" y="532" fill="#b8cdd8" font-size="18" font-weight="400">No model-controlled raw motors</text><rect x="576" y="410" width="448" height="145" rx="15" fill="#122331" stroke="#294858" stroke-width="2"/><rect x="576" y="410" width="6" height="145" rx="3" fill="#50d9e6"/><text x="600" y="440" fill="#50d9e6" font-size="15" font-weight="700">MOTOR CONTROL</text><text x="600" y="475" fill="#f2f8fb" font-size="25" font-weight="700">ESP32 controller</text><text x="600" y="506" fill="#b8cdd8" font-size="18" font-weight="400">Watchdog and obstacle stop</text><text x="600" y="532" fill="#b8cdd8" font-size="18" font-weight="400">Commands motor driver</text><rect x="1088" y="410" width="448" height="145" rx="15" fill="#122331" stroke="#294858" stroke-width="2"/><rect x="1088" y="410" width="6" height="145" rx="3" fill="#50d9e6"/><text x="1112" y="440" fill="#50d9e6" font-size="15" font-weight="700">PHYSICAL DRIVE</text><text x="1112" y="475" fill="#f2f8fb" font-size="25" font-weight="700">Driver + motors</text><text x="1112" y="506" fill="#b8cdd8" font-size="18" font-weight="400">Encoders return motion feedback</text><text x="1112" y="532" fill="#b8cdd8" font-size="18" font-weight="400">Wheels move the rover</text><path d="M512 482 H570" fill="none" stroke="#64d4df" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1024 482 H1082" fill="none" stroke="#64d4df" stroke-width="3"  marker-end="url(#arrow)"/><rect x="64" y="610" width="448" height="145" rx="15" fill="#122331" stroke="#294858" stroke-width="2"/><rect x="64" y="610" width="6" height="145" rx="3" fill="#50d9e6"/><text x="88" y="640" fill="#50d9e6" font-size="15" font-weight="700">SUPPLY</text><text x="88" y="675" fill="#f2f8fb" font-size="25" font-weight="700">Protected battery</text><text x="88" y="706" fill="#b8cdd8" font-size="18" font-weight="400">Fuse and master switch</text><text x="88" y="732" fill="#b8cdd8" font-size="18" font-weight="400">Separate compute and motor rails</text><rect x="576" y="610" width="448" height="145" rx="15" fill="#122331" stroke="#294858" stroke-width="2"/><rect x="576" y="610" width="6" height="145" rx="3" fill="#f0b35f"/><text x="600" y="640" fill="#f0b35f" font-size="15" font-weight="700">MOTOR RAIL</text><text x="600" y="675" fill="#f2f8fb" font-size="25" font-weight="700">Physical E-stop</text><text x="600" y="706" fill="#b8cdd8" font-size="18" font-weight="400">Accessible independent stop</text><text x="600" y="732" fill="#b8cdd8" font-size="18" font-weight="400">Interrupts motor power</text><rect x="1088" y="610" width="448" height="145" rx="15" fill="#122331" stroke="#294858" stroke-width="2"/><rect x="1088" y="610" width="6" height="145" rx="3" fill="#50d9e6"/><text x="1112" y="640" fill="#50d9e6" font-size="15" font-weight="700">COMPUTE RAIL</text><text x="1112" y="675" fill="#f2f8fb" font-size="25" font-weight="700">Pi regulator</text><text x="1112" y="706" fill="#b8cdd8" font-size="18" font-weight="400">Dedicated regulated supply</text><text x="1112" y="732" fill="#b8cdd8" font-size="18" font-weight="400">Separate from motor power</text><path d="M512 665 H570" fill="none" stroke="#64d4df" stroke-width="3"  marker-end="url(#arrow)"/><path d="M290 755 V778 H1312 V755" fill="none" stroke="#64d4df" stroke-width="3"  marker-end="url(#arrow)"/><path d="M800 610 V580 H1312 V560" fill="none" stroke="#64d4df" stroke-width="3"  marker-end="url(#arrow)"/><text x="64" y="808" fill="#b9cbd5" font-size="18" font-weight="400">Final wiring depends on purchased parts; local safety behavior and electrical tests remain unverified.</text><path d="M64 837 H1536" stroke="#294858"/><text x="64" y="865" fill="#9eb4c0" font-size="16" font-weight="400">PROPOSED ARCHITECTURE • rover prototype photographed; wiring and tests not verified</text></g></svg>