<rect width="1600" height="900" fill="url(#bg)"/><path d="M0 145 H1600" stroke="#294858"/>
<g font-family="Inter, Arial, sans-serif"><text x="64" y="52" fill="#63dce8" font-size="16" font-weight="700">BLINDSPOT  /  VISUAL FIELD GUIDE</text><text x="64" y="95" fill="#f3f9fc" font-size="37" font-weight="700">How the software works</text><text x="64" y="124" fill="#a9c0cc" font-size="19" font-weight="400">Two paths: the runnable local demo and the separately integrated stack</text><text x="64" y="195" fill="#6de1d9" font-size="16" font-weight="700">AVAILABLE NOW  /  PHANTOM COMMAND</text><rect x="64" y="225" width="448" height="150" rx="15" fill="#122331" stroke="#294858" stroke-width="2"/><rect x="64" y="225" width="6" height="150" rx="3" fill="#50d9e6"/><text x="88" y="255" fill="#50d9e6" font-size="15" font-weight="700">SIMULATED INPUT</text><text x="88" y="290" fill="#f2f8fb" font-size="25" font-weight="700">Scenario + observations</text><text x="88" y="321" fill="#b8cdd8" font-size="18" font-weight="400">Deterministic fixtures</text><text x="88" y="347" fill="#b8cdd8" font-size="18" font-weight="400">Synthetic events and telemetry</text><rect x="576" y="225" width="448" height="150" rx="15" fill="#122331" stroke="#294858" stroke-width="2"/><rect x="576" y="225" width="6" height="150" rx="3" fill="#50d9e6"/><text x="600" y="255" fill="#50d9e6" font-size="15" font-weight="700">SIMULATION ENGINE</text><text x="600" y="290" fill="#f2f8fb" font-size="25" font-weight="700">Correlate + investigate</text><text x="600" y="321" fill="#b8cdd8" font-size="18" font-weight="400">Mock agent and policy decisions</text><text x="600" y="347" fill="#b8cdd8" font-size="18" font-weight="400">Bounded simulated rover mission</text><rect x="1088" y="225" width="448" height="150" rx="15" fill="#122331" stroke="#294858" stroke-width="2"/><rect x="1088" y="225" width="6" height="150" rx="3" fill="#50d9e6"/><text x="1112" y="255" fill="#50d9e6" font-size="15" font-weight="700">SHARED INTERFACE</text><text x="1112" y="290" fill="#f2f8fb" font-size="25" font-weight="700">Present + resolve</text><text x="1112" y="321" fill="#b8cdd8" font-size="18" font-weight="400">In-memory shared state</text><text x="1112" y="347" fill="#b8cdd8" font-size="18" font-weight="400">Twin, incident, RF and rover views</text><rect x="64" y="525" width="448" height="150" rx="15" fill="#122331" stroke="#294858" stroke-width="2"/><rect x="64" y="525" width="6" height="150" rx="3" fill="#f0b35f"/><text x="88" y="555" fill="#f0b35f" font-size="15" font-weight="700">INTEGRATION PATH</text><text x="88" y="590" fill="#f2f8fb" font-size="25" font-weight="700">Device + gateway</text><text x="88" y="621" fill="#b8cdd8" font-size="18" font-weight="400">MQTT, validation, normalization</text><text x="88" y="647" fill="#b8cdd8" font-size="18" font-weight="400">Device observations to reducers</text><rect x="576" y="525" width="448" height="150" rx="15" fill="#122331" stroke="#294858" stroke-width="2"/><rect x="576" y="525" width="6" height="150" rx="3" fill="#f0b35f"/><text x="600" y="555" fill="#f0b35f" font-size="15" font-weight="700">STATE + INVESTIGATION</text><text x="600" y="590" fill="#f2f8fb" font-size="25" font-weight="700">SpacetimeDB + agent</text><text x="600" y="621" fill="#b8cdd8" font-size="18" font-weight="400">Transactional state and feeds</text><text x="600" y="647" fill="#b8cdd8" font-size="18" font-weight="400">Nemotron or configured fake</text><rect x="1088" y="525" width="448" height="150" rx="15" fill="#122331" stroke="#294858" stroke-width="2"/><rect x="1088" y="525" width="6" height="150" rx="3" fill="#f0b35f"/><text x="1112" y="555" fill="#f0b35f" font-size="15" font-weight="700">COMMAND + RESPONSE</text><text x="1112" y="590" fill="#f2f8fb" font-size="25" font-weight="700">Operator + executor</text><text x="1112" y="621" fill="#b8cdd8" font-size="18" font-weight="400">Human approval for lab actions</text><text x="1112" y="647" fill="#b8cdd8" font-size="18" font-weight="400">Verify and audit outcome</text><path d="M512 300 H570" fill="none" stroke="#64d4df" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1024 300 H1082" fill="none" stroke="#64d4df" stroke-width="3"  marker-end="url(#arrow)"/><path d="M512 600 H570" fill="none" stroke="#64d4df" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1024 600 H1082" fill="none" stroke="#64d4df" stroke-width="3"  marker-end="url(#arrow)"/><text x="64" y="493" fill="#f0b35f" font-size="16" font-weight="700">SEPARATE INTEGRATION PATH  /  NOT CONNECTED TO THE FRONTEND DEMO</text><text x="64" y="766" fill="#a9c0cc" font-size="19" font-weight="400">The demo uses no live hardware, backend or model calls. Integration pieces have their own runbooks.</text><path d="M64 837 H1536" stroke="#294858"/><text x="64" y="865" fill="#9eb4c0" font-size="16" font-weight="400">Current status from apps/dashboard/twin/README.md and docs/15-DEVELOPER-RUNBOOK.md</text></g></svg>