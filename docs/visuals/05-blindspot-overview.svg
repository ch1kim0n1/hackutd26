<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="BlindSpot high-level system flow and technology stack"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111b"/><stop offset="1" stop-color="#132331"/></linearGradient><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8Z" fill="#58d9e5"/></marker></defs><rect width="1920" height="1080" fill="url(#bg)"/><g font-family="Inter, Arial, sans-serif"><text x="85" y="74" text-anchor="start" fill="#57dce7" font-size="22" font-weight="700">BLINDSPOT  /  HACKUTD 2026</text><text x="85" y="139" text-anchor="start" fill="#f3faff" font-size="55" font-weight="700">From blind spot to informed response</text><text x="85" y="184" text-anchor="start" fill="#a9bfcb" font-size="26" font-weight="400">A high-level view of the intended cyber-physical security workflow</text><rect x="85" y="265" width="385" height="264" rx="18" fill="#122634" stroke="#315465" stroke-width="2"/><rect x="85" y="265" width="7" height="264" rx="3" fill="#55d8e4"/><text x="113" y="307" text-anchor="start" fill="#57dce7" font-size="18" font-weight="700">01  /  SENSE</text><text x="113" y="356" text-anchor="start" fill="#f5fbfd" font-size="29" font-weight="700">Spot an anomaly</text><text x="113" y="405" text-anchor="start" fill="#b2c8d3" font-size="22" font-weight="400">Sensors + rover collect</text><text x="113" y="437" text-anchor="start" fill="#b2c8d3" font-size="22" font-weight="400">wireless and physical signals</text><path d="M478 396 H530" stroke="#58d9e5" stroke-width="4" fill="none" marker-end="url(#arr)"/><rect x="540" y="265" width="385" height="264" rx="18" fill="#122634" stroke="#315465" stroke-width="2"/><rect x="540" y="265" width="7" height="264" rx="3" fill="#55d8e4"/><text x="568" y="307" text-anchor="start" fill="#57dce7" font-size="18" font-weight="700">02  /  ANALYZE</text><text x="568" y="356" text-anchor="start" fill="#f5fbfd" font-size="29" font-weight="700">Make sense of it</text><text x="568" y="405" text-anchor="start" fill="#b2c8d3" font-size="22" font-weight="400">Validate observations and</text><text x="568" y="437" text-anchor="start" fill="#b2c8d3" font-size="22" font-weight="400">connect them to an incident</text><path d="M933 396 H985" stroke="#58d9e5" stroke-width="4" fill="none" marker-end="url(#arr)"/><rect x="995" y="265" width="385" height="264" rx="18" fill="#122634" stroke="#315465" stroke-width="2"/><rect x="995" y="265" width="7" height="264" rx="3" fill="#55d8e4"/><text x="1023" y="307" text-anchor="start" fill="#57dce7" font-size="18" font-weight="700">03  /  INVESTIGATE</text><text x="1023" y="356" text-anchor="start" fill="#f5fbfd" font-size="29" font-weight="700">Gather evidence</text><text x="1023" y="405" text-anchor="start" fill="#b2c8d3" font-size="22" font-weight="400">Agent-guided investigation</text><text x="1023" y="437" text-anchor="start" fill="#b2c8d3" font-size="22" font-weight="400">and bounded rover inspection</text><path d="M1388 396 H1440" stroke="#58d9e5" stroke-width="4" fill="none" marker-end="url(#arr)"/><rect x="1450" y="265" width="385" height="264" rx="18" fill="#122634" stroke="#315465" stroke-width="2"/><rect x="1450" y="265" width="7" height="264" rx="3" fill="#f2b45e"/><text x="1478" y="307" text-anchor="start" fill="#f0b25e" font-size="18" font-weight="700">04  /  RESPOND</text><text x="1478" y="356" text-anchor="start" fill="#f5fbfd" font-size="29" font-weight="700">Decide and verify</text><text x="1478" y="405" text-anchor="start" fill="#b2c8d3" font-size="22" font-weight="400">Operator reviews the response;</text><text x="1478" y="437" text-anchor="start" fill="#b2c8d3" font-size="22" font-weight="400">results are recorded and checked</text><text x="85" y="602" text-anchor="start" fill="#68dfeb" font-size="19" font-weight="700">BUILT WITH</text><text x="85" y="640" text-anchor="start" fill="#d8e9ef" font-size="25"