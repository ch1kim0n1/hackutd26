<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="From signal to decision">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08121d"/><stop offset="1" stop-color="#101d29"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64d4df"/></marker></defs>
<rect width="1600" height="900" fill="url(#bg)"/><path d="M0 145 H1600" stroke="#294858"/>
<g font-family="Inter, Arial, sans-serif"><text x="64" y="52" fill="#63dce8" font-size="16" font-weight="700">BLINDSPOT  /  VISUAL FIELD GUIDE</text><text x="64" y="95" fill="#f3f9fc" font-size="37" font-weight="700">From signal to decision</text><text x="64" y="124" fill="#a9c0cc" font-size="19" font-weight="400">Evidence provenance and decision boundaries across the workflow</text><rect x="64" y="305" width="270" height="170" rx="15" fill="#122331" stroke="#294858" stroke-width="2"/><rect x="64" y="305" width="6" height="170" rx="3" fill="#50d9e6"/><text x="88" y="335" fill="#50d9e6" font-size="15" font-weight="700">01 / OBSERVED</text><text x="88" y="370" fill="#f2f8fb" font-size="25" font-weight="700">Sensor observations</text><text x="88" y="401" fill="#b8cdd8" font-size="18" font-weight="400">Measurements + timestamps</text><text x="88" y="427" fill="#b8cdd8" font-size="18" font-weight="400">Source and provenance</text><path d="M334 390 H362" fill="none" stroke="#64d4df" stroke-width="3"  marker-end="url(#arrow)"/><rect x="368" y="305" width="270" height="170" rx="15" fill="#122331" stroke="#294858" stroke-width="2"/><rect x="368" y="305" width="6" height="170" rx="3" fill="#50d9e6"/><text x="392" y="335" fill="#50d9e6" font-size="15" font-weight="700">02 / DERIVED</text><text x="392" y="370" fill="#f2f8fb" font-size="25" font-weight="700">Correlation</text><text x="392" y="401" fill="#b8cdd8" font-size="18" font-weight="400">Rules link observations</text><text x="392" y="427" fill="#b8cdd8" font-size="18" font-weight="400">A relationship, not proof</text><path d="M638 390 H666" fill="none" stroke="#64d4df" stroke-width="3"  marker-end="url(#arrow)"/><rect x="672" y="305" width="270" height="170" rx="15" fill="#122331" stroke="#294858" stroke-width="2"/><rect x="672" y="305" width="6" height="170" rx="3" fill="#50d9e6"/><text x="696" y="335" fill="#50d9e6" font-size="15" font-weight="700">03 / INFERRED</text><text x="696" y="370" fill="#f2f8fb" font-size="25" font-weight="700">Agent hypothesis</text><text x="696" y="401" fill="#b8cdd8" font-size="18" font-weight="400">Evidence-backed hypothesis</text><text x="696" y="427" fill="#b8cdd8" font-size="18" font-weight="400">Alternatives and uncertainty</text><path d="M942 390 H970" fill="none" stroke="#64d4df" stroke-width="3"  marker-end="url(#arrow)"/><rect x="976" y="305" width="270" height="170" rx="15" fill="#122331" stroke="#294858" stroke-width="2"/><rect x="976" y="305" width="6" height="170" rx="3" fill="#f0b35f"/><text x="1000" y="335" fill="#f0b35f" font-size="15" font-weight="700">04 / APPROVED</text><text x="1000" y="370" fill="#f2f8fb" font-size="25" font-weight="700">Human decision</text><text x="1000" y="401" fill="#b8cdd8" font-size="18" font-weight="400">Authorized operator review</text><text x="1000" y="427" fill="#b8cdd8" font-size="18" font-weight="400">Scope is limited to the lab</text><path d="M1246 390 H1274" fill="none" stroke="#64d4df" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1280" y="305" width="270" height="170" rx="15" fill="#122331" stroke="#294858" stroke-width="2"/><rect x="1280" y="305" width="6" height="170" rx="3" fill="#50d9e6"/><text x="1304" y="335" fill="#50d9e6" font-size="15" font-weight="700">05 / VERIFIED</text><text x="1304" y="370" fill="#f2f8fb" font-size="25" font-weight="700">Outcome</text><text x="1304" y="401" fill="#b8cdd8" font-size="18" font-weight="400">Independent result check</text><text x="1304" y="427" fill="#b8cdd8" font-size="18" font-weight="400">Recorded in incident timeline</text><text x="64" y="595" fill="#b9cbd5" font-size="21" font-weight="400">Keep LIVE, REPLAY and DEMO provenance visible. A wireless anomaly alone does not prove exfiltration.</text><text x="64" y="641" fill="#8fa9b7" font-size="19" font-weight="400">This is a conceptual evidence graph, not a measured performance chart.</text><path d="M64 837 H1536" stroke="#294858"/><text x="64" y="865" fill="#9eb4c0" font-size="16" font-weight="400">Conceptual graph • no numerical performance claims</text></g></svg>