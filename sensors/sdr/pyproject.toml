[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdr-waterfall"
version = "0.1.0"
description = "SENTINEL HIVE honest SDR IQ/FFT capture + Wi-Fi channel activity fallback"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]
live = ["SoapySDR>=0.8", "pyrtlsdr>=0.3"]  # optional, hardware-gated

[tool.setuptools.packages.find]
where = ["src"]
