[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-correlator"
version = "0.1.0"
description = "SENTINEL HIVE RF observation normalizer + RF01/PHY01/CORR01 correlator"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
